version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      # Conventional Commits — chore(deps) produces no release, fix(deps) does
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # typescript-eslint's peer range caps TypeScript below 6.1.0, so a TS 7 bump
      # makes `npm ci` fail with ERESOLVE. Drop this once typescript-eslint ships
      # support for TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
