name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # git tags, CHANGELOG commit, GitHub Release
  issues: write # semantic-release success comments
  pull-requests: write
  packages: write # publish to npm.pkg.github.com
  id-token: write

env:
  # `npm ci` runs `prepare: husky`, which would install the commit-msg hook into the
  # runner's checkout — and that hook would then reject semantic-release's own
  # release commit. Git hooks have no purpose in CI.
  HUSKY: 0

jobs:
  release:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release needs full history + tags to determine the last release
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@bstockus"

      - run: npm ci

      # Gate: never publish a red build.
      - name: Run tests
        run: npm test

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Packages authenticates the npm client with the same token.
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
