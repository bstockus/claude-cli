name: Prune package versions

# Deletes old versions from GitHub Packages, keeping the newest few. Deleting a
# published version is irreversible, so manual runs default to a dry run and the
# selection logic is unit-tested in tests/unit/prune-package-versions.test.js.
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays, 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would be deleted, without deleting it
        type: boolean
        default: true
      keep:
        description: How many of the newest versions to keep
        type: string
        default: "3"

concurrency:
  group: prune-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    name: Prune old versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The package is owned by a user, not an organisation. Deletion goes through
      # /user/packages/..., which acts on the *authenticated user* — and in Actions
      # GITHUB_TOKEN authenticates as github-actions[bot], which does not own the
      # package. A PAT with read:packages + delete:packages is therefore required.
      - name: Require a packages token
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PACKAGES_TOKEN secret is not set. Create a personal access token with read:packages and delete:packages, then add it as a repository secret named PACKAGES_TOKEN."
            exit 1
          fi

      - name: Prune
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          KEEP: ${{ inputs.keep || '3' }}
          # Scheduled runs prune for real; manual runs honour the dry_run input,
          # which defaults to true so a hand-triggered run cannot delete by accident.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: |
          # Derived rather than hardcoded so a package rename cannot silently
          # point this at the wrong package. GitHub Packages uses the unscoped name.
          PACKAGE_NAME=$(node -p "require('./package.json').name.split('/').pop()")
          export PACKAGE_NAME
          echo "Package: $PACKAGE_NAME | keep: $KEEP | dry run: $DRY_RUN"
          node scripts/prune-package-versions.js
